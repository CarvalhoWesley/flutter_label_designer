name: flutter_label_printer_windows
description: >
  Backend do contrato de transporte de flutter_label_printer para o spooler de impressão do Windows,
  embrulhando o pacote de terceiros windows_printer (impressão raw via USB
  e impressão de PDF pelo driver instalado). Windows-only por natureza —
  ver docs/ROADMAP.md, etapa 20, para os backends irmãos planejados
  (rede/TCP, serial) que não dependem deste pacote.
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_label_printer: ^2.0.0
  windows_printer: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
