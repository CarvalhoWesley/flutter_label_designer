name: label_renderer_raster
description: >
  Base genérica para impressão em imagem: rasteriza um ResolvedDocument
  inteiro via label_renderer_canvas em uma imagem monocromática e entrega
  para uma RasterPrinterLanguage, que monta o trabalho na linguagem da
  impressora (PPLA, PPLB, ZPL...). Não contém nada específico de fabricante.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  label_core:
    path: ../label_core
  label_renderer:
    path: ../label_renderer
  label_renderer_canvas:
    path: ../label_renderer_canvas

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  lints: ^5.0.0
