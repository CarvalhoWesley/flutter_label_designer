name: flutter_label_designer
description: >
  Editor visual de etiquetas para Flutter (canvas, painel de propriedades,
  preview ao vivo, desfazer/refazer), construído sobre flutter_label_printer.
version: 2.0.0
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.0
  flutter_label_printer: ^2.0.0
  flutter_mobx: ^2.3.0
  mobx: ^2.5.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  mobx_codegen: ^2.7.0
  test: ^1.24.0
